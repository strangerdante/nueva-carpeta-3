<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Página Sencilla</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
    }
    h1 { font-size: 1.9rem; margin-bottom: .75rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .hint { font-size: .85rem; color: #64748b; margin-bottom: 1rem; }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: .75rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #4f46e5; }
    #msg { margin-top: 1rem; font-weight: 600; color: #34d399; min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hola, mundo 👋</h1>
    <p>Esta es una página HTML sencilla con estilos y un poco de interactividad.</p>
    <p class="hint">Hecho por strangerdante</p>
    <button id="btn">Haz clic aquí</button>
    <div id="msg"></div>
  </main>

  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    let count = 0;
    btn.addEventListener('click', () => {
      count++;
      msg.textContent = `¡Has hecho clic ${count} ${count === 1 ? 'vez' : 'veces'}!`;
    });
  </script>
</body>
</html>
